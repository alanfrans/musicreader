[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musicreader"
version = "0.1.0"
description = "Reconstruct hymn lyrics from sheet-music images and PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.22",
    "opencv-python>=4.11",
    "PyMuPDF>=1.26",
    "rapidocr>=3.4",
    "mcp>=1.30.0,<2",
]

[project.scripts]
musicreader = "musicreader.cli:main"

[tool.setuptools.packages.find]
include = ["musicreader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
